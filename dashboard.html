<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>

  <!-- Fuente Inter (Google Fonts) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome (iconos) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Nuestro CSS -->
  <link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body>

  <header>
    <!-- Aquí pones tu logo -->
    <img class="logo" src="assets/image/logo.png" alt="Logo">

    <!-- Vuelve al login. En celular se ve la X; en tablet y PC, el icono de salir -->
    <a class="cerrar" href="login.html">
      <i class="fa-solid fa-xmark icono-x"></i>
      <i class="fa-solid fa-right-from-bracket icono-salir"></i>
    </a>
  </header>

  <main>
    <a class="conocenos" href="#">
      <h2>Conócenos</h2>
      <img src="assets/image/conocenos.png" alt="Conócenos">
    </a>

    <a class="asistencia" href="asistencia.html">
      <h2>Ingrese su asistencia</h2>
      <img src="assets/image/asistencia.png" alt="Asistencia">
    </a>

    <a class="soporte" href="#">
      <h2>Soporte</h2>
      <img src="assets/image/soporte.png" alt="Soporte">
    </a>
  </main>

</body>
</html>
